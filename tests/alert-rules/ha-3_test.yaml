rule_files:
  - rules-3.yaml
evaluation_interval: 1m
tests:
  - name: 3 instances with 0 connected standbys
    interval: 1m
    input_series:
      - series: cnpg_pg_replication_streaming_replicas{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
      - series: cnpg_pg_replication_is_wal_receiver_up{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
      - series: cnpg_pg_replication_in_recovery{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
      - series: cnpg_collector_replica_mode{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
    alert_rule_test:
      - eval_time: 4m
        alertname: CNPGClusterHAWarning
        exp_alerts: []
      - eval_time: 4m
        alertname: CNPGClusterHACritical
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterHAWarning
        exp_alerts:
          - exp_labels:
              namespace: alert-test
              cnpg_cluster: alerts-paradedb
              job: alert-test/alerts-paradedb
              severity: warning
            exp_annotations:
              summary: ParadeDB CNPG Cluster has fewer standby replicas than configured.
              description:
                'ParadeDB CloudNativePG Cluster "alert-test/alerts-paradedb" has only 0 of its 2
                configured standby replicas, putting your cluster at risk if another instance fails. The cluster
                is still able to operate normally, although the `-ro` and `-r` endpoints are operating at reduced
                capacity.


                This can happen during a normal fail-over or automated minor version upgrades. The replaced
                instance may need some time to catch-up with the cluster primary instance.'
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterHA.md
      - eval_time: 5m
        alertname: CNPGClusterHACritical
        exp_alerts:
          - exp_labels:
              namespace: alert-test
              cnpg_cluster: alerts-paradedb
              job: alert-test/alerts-paradedb
              severity: critical
            exp_annotations:
              summary: ParadeDB CNPG Cluster has no standby replicas!
              description:
                'ParadeDB CloudNativePG Cluster "alert-test/alerts-paradedb" has no ready standby
                replicas. The cluster is at a severe risk of data loss and downtime if the primary instance
                fails.


                The primary instance is still online and able to serve queries, although connections to the
                `-ro` endpoint will fail. The `-r` endpoint is operating at reduced capacity and all traffic
                is being served by the primary.


                This can happen during a normal fail-over or automated minor version upgrades in a cluster with
                2 or less instances. The replaced instance may need some time to catch-up with the cluster primary
                instance.'
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterHA.md
  - name: 3 instances with 1 connected standbys
    interval: 1m
    input_series:
      - series: cnpg_pg_replication_streaming_replicas{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 1+0x15
      - series: cnpg_pg_replication_is_wal_receiver_up{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
      - series: cnpg_pg_replication_in_recovery{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
      - series: cnpg_collector_replica_mode{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
    alert_rule_test:
      - eval_time: 4m
        alertname: CNPGClusterHAWarning
        exp_alerts: []
      - eval_time: 4m
        alertname: CNPGClusterHACritical
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterHAWarning
        exp_alerts:
          - exp_labels:
              namespace: alert-test
              cnpg_cluster: alerts-paradedb
              job: alert-test/alerts-paradedb
              severity: warning
            exp_annotations:
              summary: ParadeDB CNPG Cluster has fewer standby replicas than configured.
              description:
                'ParadeDB CloudNativePG Cluster "alert-test/alerts-paradedb" has only 1 of its 2
                configured standby replicas, putting your cluster at risk if another instance fails. The cluster
                is still able to operate normally, although the `-ro` and `-r` endpoints are operating at reduced
                capacity.


                This can happen during a normal fail-over or automated minor version upgrades. The replaced
                instance may need some time to catch-up with the cluster primary instance.'
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterHA.md
      - eval_time: 5m
        alertname: CNPGClusterHACritical
        exp_alerts: []
  - name: 3 instances with 2 connected standbys
    interval: 1m
    input_series:
      - series: cnpg_pg_replication_streaming_replicas{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 2+0x15
      - series: cnpg_pg_replication_is_wal_receiver_up{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
      - series: cnpg_pg_replication_in_recovery{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
      - series: cnpg_collector_replica_mode{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
    alert_rule_test:
      - eval_time: 4m
        alertname: CNPGClusterHAWarning
        exp_alerts: []
      - eval_time: 4m
        alertname: CNPGClusterHACritical
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterHAWarning
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterHACritical
        exp_alerts: []
  - name: dedicated replica cluster is excluded from HA alerts
    interval: 1m
    input_series:
      - series: cnpg_pg_replication_streaming_replicas{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
      - series: cnpg_pg_replication_is_wal_receiver_up{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
      - series: cnpg_pg_replication_in_recovery{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 1+0x15
      - series: cnpg_collector_replica_mode{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 1+0x15
    alert_rule_test:
      - eval_time: 10m
        alertname: CNPGClusterHAWarning
        exp_alerts: []
      - eval_time: 10m
        alertname: CNPGClusterHACritical
        exp_alerts: []
  - name: recovering instance is excluded from HA alerts
    interval: 1m
    input_series:
      - series: cnpg_pg_replication_streaming_replicas{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
      - series: cnpg_pg_replication_is_wal_receiver_up{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
      - series: cnpg_pg_replication_in_recovery{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 1+0x15
      - series: cnpg_collector_replica_mode{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
    alert_rule_test:
      - eval_time: 10m
        alertname: CNPGClusterHAWarning
        exp_alerts: []
      - eval_time: 10m
        alertname: CNPGClusterHACritical
        exp_alerts: []
