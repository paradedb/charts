{{- $alert := "CNPGInstanceMetricsAbsent" -}}
{{- if not (has $alert .excludeRules) -}}
alert: {{ $alert }}
annotations:
  summary: ParadeDB CNPG instance metrics are missing
  description: |-
    ParadeDB CNPG instance "{{ .namespace }}/{{ .labels.pod }}" has responded to scrapes without collector metrics for 10 minutes.

    Alerts that depend on missing series cannot fire. Check database and replication health directly.
  runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGInstanceMetricsAbsent.md
expr: |
  max by (namespace, pod) (up{namespace="{{ .namespace }}",pod=~"{{ .podSelector }}",endpoint="metrics"} == 1)
  unless on (namespace, pod)
  count by (namespace, pod) (cnpg_collector_up{namespace="{{ .namespace }}",pod=~"{{ .podSelector }}"})
for: 10m
labels:
  severity: critical
  namespace: {{ .namespace }}
  cnpg_cluster: {{ .cluster }}
{{- range $key, $val := .additionalLabels }}
  {{ $key }}: {{ $val | toString | quote }}
{{- end }}
{{- end -}}
