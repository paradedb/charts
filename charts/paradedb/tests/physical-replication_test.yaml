  - series: cnpg_pg_stat_replication_replay_diff_bytes{namespace="customer-acme",pod="db-1",application_name="",usename="streaming_replica"}
    values: 2147483648+0x20
  alert_rule_test:
  - eval_time: 4m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts: []
  - eval_time: 10m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts: []
- name: 'warning: absent sender series does not fall back to transaction age'
  interval: 1m
  input_series:
  - series: cnpg_pg_replication_lag{namespace="customer-acme",pod="db-2"}
    values: 8432+0x20
  alert_rule_test:
  - eval_time: 4m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts: []
  - eval_time: 10m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts: []
- name: 'warning: brief backlog does not alert'
