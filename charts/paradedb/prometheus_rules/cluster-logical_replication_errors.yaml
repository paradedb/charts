{{- $alert := "CNPGClusterLogicalReplicationErrors" -}}
{{- if not (has $alert .excludeRules) -}}
alert: {{ $alert }}
annotations:
  summary: ParadeDB logical replication errors detected
  description: |-
    CloudNativePG Cluster "{{ .namespace }}/{{ .cluster }}" subscription "{{ .labels.subname }}" has recorded {{ .value }} errors in the last 5 minutes.

    Counts both apply errors during normal replication and sync errors during initial table sync.
    Errors here mean rows are failing to land on the subscriber, which diverges it from the publisher.
  runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterLogicalReplicationErrors.md
expr: |
  max by (namespace, cluster, datname, subname) (
    label_replace(
      increase(cnpg_pg_stat_subscription_apply_error_count{namespace="{{ .namespace }}",pod=~"{{ .podSelector }}"}[5m])
      + increase(cnpg_pg_stat_subscription_sync_error_count{namespace="{{ .namespace }}",pod=~"{{ .podSelector }}"}[5m]),
      "cluster", "$1", "job", ".+/(.+)"
    )
  ) > 0
for: 1m
labels:
  severity: warning
  namespace: {{ .namespace }}
  cnpg_cluster: {{ .cluster }}
  alert_type: logical-replication
  subname: "{{ .labels.subname }}"
{{- range $key, $val := .additionalLabels }}
  {{ $key }}: {{ $val | toString | quote }}
{{- end }}
{{- end -}}
