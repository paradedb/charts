# Near-zero-downtime migration into ParadeDB using declarative logical replication.
#
# This example configures the *subscriber* side: a new ParadeDB cluster that continuously replicates
# from an existing external Postgres ("publisher") via a CNPG Subscription, so you can sync first and
# cut over once caught up. The target tables must already exist on the subscriber before the initial
# sync (logical replication copies data, not schema).
#
# On the publisher, create a publication for the tables you want to replicate, e.g.:
#   CREATE PUBLICATION migration FOR ALL TABLES;
# If the publisher is itself managed by this chart, declare it under `publications` instead.
type: paradedb
mode: standalone

cluster:
  instances: 1

# The external "publisher" the subscription reads from. Passed through verbatim to the CNPG
# Cluster's `externalClusters`, so any connection/TLS option CNPG supports is available here.
externalClusters:
  - name: publisher
    connectionParameters:
      host: source-postgres.example.com
      port: "5432"
      user: postgres
      dbname: app
      sslmode: verify-full
    password:
      name: publisher-credentials
      key: password

subscriptions:
  - name: migration
    dbname: app
    externalClusterName: publisher
    publicationName: migration

backups:
  enabled: false
