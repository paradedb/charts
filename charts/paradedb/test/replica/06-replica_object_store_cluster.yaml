type: paradedb-enterprise
mode: replica
version:
  major: "18"
  paradedb: "0.25.6"
cluster:
  instances: 1
  storage:
    size: 256Mi
  imagePullSecrets:
    - name: paradedb-enterprise-registry-cred

replica:
  name: "off-site-backup1"
  bootstrap:
    source: object_store
  origin:
    objectStore:
      clusterName: source-paradedb
      provider: s3
      endpointURL: "https://object-store-svc.object-store.svc.cluster.local:9000"
      endpointCA:
        name: kube-root-ca.crt
        key: ca.crt
      wal:
        encryption: ""
      data:
        encryption: ""
      s3:
        bucket: "mybucket"
        path: "/replica/v1"
        accessKey: "objectstore"
        secretKey: "objectstore123"
        region: "us-east-1"
      scheduledBackups: []
      retentionPolicy: "30d"
