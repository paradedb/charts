rule_files:
  - rules-3.yaml
evaluation_interval: 1m
tests:
  - name: 0 GiB backlog is attributed to the receiving physical replica
    interval: 1m
    input_series:
      - series: cnpg_pg_stat_replication_replay_diff_bytes{namespace="alert-test",pod="alerts-paradedb-1",usename="streaming_replica",application_name="alerts-paradedb-2"}
        values: 0+0x15
    alert_rule_test:
      - eval_time: 4m
        alertname: CNPGClusterPhysicalReplicationBacklogWarning
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterPhysicalReplicationBacklogWarning
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterPhysicalReplicationBacklogCritical
        exp_alerts: []
  - name: 1 GiB backlog is attributed to the receiving physical replica
    interval: 1m
    input_series:
      - series: cnpg_pg_stat_replication_replay_diff_bytes{namespace="alert-test",pod="alerts-paradedb-1",usename="streaming_replica",application_name="alerts-paradedb-2"}
        values: 1073741824+0x15
    alert_rule_test:
      - eval_time: 4m
        alertname: CNPGClusterPhysicalReplicationBacklogWarning
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterPhysicalReplicationBacklogWarning
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterPhysicalReplicationBacklogCritical
        exp_alerts: []
  - name: 2 GiB backlog is attributed to the receiving physical replica
    interval: 1m
    input_series:
      - series: cnpg_pg_stat_replication_replay_diff_bytes{namespace="alert-test",pod="alerts-paradedb-1",usename="streaming_replica",application_name="alerts-paradedb-2"}
        values: 2147483648+0x15
    alert_rule_test:
      - eval_time: 4m
        alertname: CNPGClusterPhysicalReplicationBacklogWarning
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterPhysicalReplicationBacklogWarning
        exp_alerts:
          - exp_labels:
              namespace: alert-test
              cnpg_cluster: alerts-paradedb
              pod: alerts-paradedb-2
              severity: warning
            exp_annotations:
              summary: ParadeDB physical replica WAL backlog warning
              description:
                Physical replica "alert-test/alerts-paradedb-2" has 2 GiB of unreplayed WAL. Check
                WAL ingestion, replay progress, disk, network, and recovery conflicts.
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
      - eval_time: 5m
        alertname: CNPGClusterPhysicalReplicationBacklogCritical
        exp_alerts: []
  - name: 10 GiB backlog is attributed to the receiving physical replica
    interval: 1m
    input_series:
      - series: cnpg_pg_stat_replication_replay_diff_bytes{namespace="alert-test",pod="alerts-paradedb-1",usename="streaming_replica",application_name="alerts-paradedb-2"}
        values: 10737418240+0x15
    alert_rule_test:
      - eval_time: 4m
        alertname: CNPGClusterPhysicalReplicationBacklogWarning
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterPhysicalReplicationBacklogWarning
        exp_alerts:
          - exp_labels:
              namespace: alert-test
              cnpg_cluster: alerts-paradedb
              pod: alerts-paradedb-2
              severity: warning
            exp_annotations:
              summary: ParadeDB physical replica WAL backlog warning
              description:
                Physical replica "alert-test/alerts-paradedb-2" has 10 GiB of unreplayed WAL. Check
                WAL ingestion, replay progress, disk, network, and recovery conflicts.
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
      - eval_time: 5m
        alertname: CNPGClusterPhysicalReplicationBacklogCritical
        exp_alerts: []
  - name: 11 GiB backlog is attributed to the receiving physical replica
    interval: 1m
    input_series:
      - series: cnpg_pg_stat_replication_replay_diff_bytes{namespace="alert-test",pod="alerts-paradedb-1",usename="streaming_replica",application_name="alerts-paradedb-2"}
        values: 11811160064+0x15
    alert_rule_test:
      - eval_time: 4m
        alertname: CNPGClusterPhysicalReplicationBacklogWarning
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterPhysicalReplicationBacklogWarning
        exp_alerts:
          - exp_labels:
              namespace: alert-test
              cnpg_cluster: alerts-paradedb
              pod: alerts-paradedb-2
              severity: warning
            exp_annotations:
              summary: ParadeDB physical replica WAL backlog warning
              description:
                Physical replica "alert-test/alerts-paradedb-2" has 11 GiB of unreplayed WAL. Check
                WAL ingestion, replay progress, disk, network, and recovery conflicts.
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
      - eval_time: 5m
        alertname: CNPGClusterPhysicalReplicationBacklogCritical
        exp_alerts:
          - exp_labels:
              namespace: alert-test
              cnpg_cluster: alerts-paradedb
              pod: alerts-paradedb-2
              severity: critical
            exp_annotations:
              summary: ParadeDB physical replica WAL backlog critical
              description:
                Physical replica "alert-test/alerts-paradedb-2" has 11 GiB of unreplayed WAL. Check
                WAL ingestion, replay progress, disk, network, and recovery conflicts.
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
  - name: logical senders and other receiver clusters are excluded
    interval: 1m
    input_series:
      - series: cnpg_pg_stat_replication_replay_diff_bytes{namespace="alert-test",pod="alerts-paradedb-1",usename="logical_user",application_name="alerts-paradedb-2"}
        values: 21474836480+0x15
      - series: cnpg_pg_stat_replication_replay_diff_bytes{namespace="alert-test",pod="alerts-paradedb-1",usename="streaming_replica",application_name="other-2"}
        values: 21474836480+0x15
      - series: cnpg_pg_stat_replication_replay_diff_bytes{namespace="other",pod="alerts-paradedb-1",usename="streaming_replica",application_name="alerts-paradedb-2"}
        values: 21474836480+0x15
    alert_rule_test:
      - eval_time: 10m
        alertname: CNPGClusterPhysicalReplicationBacklogWarning
        exp_alerts: []
      - eval_time: 10m
        alertname: CNPGClusterPhysicalReplicationBacklogCritical
        exp_alerts: []
