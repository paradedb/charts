        values: 10737418240+0x40
    alert_rule_test:
      - eval_time: 10m
        alertname: CNPGClusterLogicalReplicationDistanceHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: alert-test
              cnpg_cluster: parity-paradedb
              alert_type: logical-replication
              job: alert-test/db
              pod: parity-paradedb-1
              datname: app
              subname: orders
            exp_annotations:
              summary: ParadeDB logical replication WAL-position distance is warning
              description: |-
                ParadeDB CNPG Cluster "alert-test/parity-paradedb" reports a WAL-position difference of 2 GiB as the logical replication subscriber for subscription "orders" in database "app".

                This does not measure unapplied data. Check replication errors, worker health, and subscriber logs.
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterLogicalReplicationDistance.md
      - eval_time: 10m
        alertname: CNPGClusterLogicalReplicationDistanceCritical
