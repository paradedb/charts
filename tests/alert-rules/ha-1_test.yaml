rule_files:
  - rules-1.yaml
evaluation_interval: 1m
tests:
  - name: 1 instances with 0 connected standbys
    interval: 1m
    input_series:
      - series: cnpg_pg_replication_streaming_replicas{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
      - series: cnpg_pg_replication_is_wal_receiver_up{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
      - series: cnpg_pg_replication_in_recovery{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
      - series: cnpg_collector_replica_mode{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb"}
        values: 0+0x15
    alert_rule_test:
      - eval_time: 4m
        alertname: CNPGClusterHAWarning
        exp_alerts: []
      - eval_time: 4m
        alertname: CNPGClusterHACritical
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterHAWarning
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterHACritical
        exp_alerts: []
