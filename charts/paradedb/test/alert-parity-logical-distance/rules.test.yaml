        values: 10737418240+0x40
    alert_rule_test:
      - eval_time: 10m
        alertname: CNPGClusterLogicalReplicationDistanceHigh
        exp_alerts: []
      - eval_time: 10m
        alertname: CNPGClusterLogicalReplicationDistanceCritical
        exp_alerts: []
