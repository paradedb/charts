      customer-acme\", pod=~\"db-([1-9][0-9]*)$\"}) == 1)) * 0 + 3)\n  or on (namespace,\
      \ pod) (((((max by (namespace, pod) (label_replace(cnpg_pg_stat_replication_replay_diff_bytes{namespace=\"\
      customer-acme\", pod=~\"db-([1-9][0-9]*)$\", usename=\"streaming_replica\",\
      \ application_name=~\"db-([1-9][0-9]*)$\"}, \"pod\", \"$1\", \"application_name\"\
      , \"(.+)\"))) or on (namespace, pod) (max by (namespace, pod) (cnpg_paradedb_physical_replication_pending_bytes{namespace=\"\
      customer-acme\", pod=~\"db-([1-9][0-9]*)$\"}))) > 0)\n  and on (namespace, pod)\
      \ min_over_time((((max by (namespace, pod) (label_replace(cnpg_pg_stat_replication_replay_diff_bytes{namespace=\"\
      customer-acme\", pod=~\"db-([1-9][0-9]*)$\", usename=\"streaming_replica\",\
      \ application_name=~\"db-([1-9][0-9]*)$\"}, \"pod\", \"$1\", \"application_name\"\
      , \"(.+)\"))) or on (namespace, pod) (max by (namespace, pod) (cnpg_paradedb_physical_replication_pending_bytes{namespace=\"\
      customer-acme\", pod=~\"db-([1-9][0-9]*)$\"}))))[5m:1m]) > 0\n  and on (namespace,\
      \ pod) max by (namespace, pod) (changes(cnpg_paradedb_physical_replication_replay_lsn{namespace=\"\
      customer-acme\", pod=~\"db-([1-9][0-9]*)$\"}[5m])) == 0\n  and on (namespace,\
      \ pod) max by (namespace, pod) (count_over_time(cnpg_paradedb_physical_replication_replay_lsn{namespace=\"\
      customer-acme\", pod=~\"db-([1-9][0-9]*)$\"}[5m])) >= 5\n  and on (namespace,\
      \ pod) max by (namespace, pod) (cnpg_paradedb_physical_replication_receiver_up{namespace=\"\
      customer-acme\", pod=~\"db-([1-9][0-9]*)$\"}) == 1\n  and on (namespace, pod)\
      \ (max by (namespace, pod) (cnpg_paradedb_physical_replication_in_recovery{namespace=\"\
      customer-acme\", pod=~\"db-([1-9][0-9]*)$\"}) == 1)) * 0 + 2)\n  or on (namespace,\
      \ pod) ((((max by (namespace, pod) (label_replace(cnpg_pg_stat_replication_replay_diff_bytes{namespace=\"\
      customer-acme\", pod=~\"db-([1-9][0-9]*)$\", usename=\"streaming_replica\",\
