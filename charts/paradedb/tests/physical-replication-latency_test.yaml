rule_files:
- rules.generated.yaml
evaluation_interval: 1m
tests:
- name: latency needs pending WAL and must last five minutes
  interval: 1m
  input_series:
  - series: cnpg_pg_stat_replication_replay_lag_seconds{namespace="customer-acme",job="customer-acme/db",pod="db-1",application_name="db-2",usename="streaming_replica"}
    values: 61+0x20
  - series: cnpg_pg_stat_replication_replay_diff_bytes{namespace="customer-acme",job="customer-acme/db",pod="db-1",application_name="db-2",usename="streaming_replica"}
    values: 1+0x20
  alert_rule_test:
  - eval_time: 4m
    alertname: CNPGClusterPhysicalReplicationLagWarning
    exp_alerts: []
  - eval_time: 4m
    alertname: CNPGClusterPhysicalReplicationLagCritical
    exp_alerts: []
  - eval_time: 4m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts: []
  - eval_time: 4m
    alertname: CNPGClusterPhysicalReplicationBacklogCritical
    exp_alerts: []
  - eval_time: 10m
    alertname: CNPGClusterPhysicalReplicationLagWarning
    exp_alerts:
    - exp_labels:
        namespace: customer-acme
        pod: db-2
        severity: warning
        cnpg_cluster: db
      exp_annotations:
        summary: ParadeDB physical replica replay latency warning
        description: Physical replica "customer-acme/db-2" has 61s of replay latency and unreplayed WAL.
          Check replay progress, disk, network, and recovery conflicts.
        runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
  - eval_time: 10m
    alertname: CNPGClusterPhysicalReplicationLagCritical
    exp_alerts: []
  - eval_time: 10m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts: []
  - eval_time: 10m
    alertname: CNPGClusterPhysicalReplicationBacklogCritical
    exp_alerts: []
