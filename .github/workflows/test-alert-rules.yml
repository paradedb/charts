name: Test Alert Rules

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - charts/paradedb/**
      - tests/alert-rules/**
      - .github/scripts/test-alert-rules.py
      - .github/workflows/test-alert-rules.yml
  workflow_dispatch:

concurrency:
  group: test-alert-rules-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VICTORIAMETRICS_VERSION: v1.148.0

jobs:
  test-alert-rules:
    name: Alert Behavior
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
      - name: Install Test Tools
        run: |
          pip install PyYAML==6.0.3
          curl -fsSL "https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/${VICTORIAMETRICS_VERSION}/vmutils-linux-amd64-${VICTORIAMETRICS_VERSION}.tar.gz" \
            | tar xz vmalert-tool-prod
          sudo install vmalert-tool-prod /usr/local/bin/vmalert-tool
      - name: Test Alert Behavior
        run: python3 .github/scripts/test-alert-rules.py
