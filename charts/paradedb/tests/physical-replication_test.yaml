        severity: warning
        cnpg_cluster: db
      exp_annotations:
        summary: ParadeDB physical replica WAL backlog warning
        description: Physical replica "customer-acme/db-2" has 2 GiB of unreplayed
          WAL. Check WAL ingestion, replay progress, disk, network, and recovery conflicts.
        runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
  - eval_time: 10m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts: []
- name: 'warning: disconnected sender series becomes no data'
  interval: 1m
