rule_files:
  - rules.generated.yaml
evaluation_interval: 1m
tests:
  - name: 95 percent usage on data PVC
    interval: 1m
    input_series:
      - series: kubelet_volume_stats_available_bytes{namespace="alert-test",persistentvolumeclaim="parity-paradedb-1"}
        values: 5+0x20
      - series: kubelet_volume_stats_capacity_bytes{namespace="alert-test",persistentvolumeclaim="parity-paradedb-1"}
        values: 100+0x20
    alert_rule_test:
      - eval_time: 4m
        alertname: CNPGClusterLowDiskSpaceWarning
        exp_alerts: []
      - eval_time: 4m
        alertname: CNPGClusterLowDiskSpaceCritical
        exp_alerts: []
      - eval_time: 10m
        alertname: CNPGClusterLowDiskSpaceWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: alert-test
              cnpg_cluster: parity-paradedb
              persistentvolumeclaim: parity-paradedb-1
            exp_annotations:
              summary: ParadeDB CNPG Cluster is running out of disk space.
              description:
                ParadeDB CloudNativePG Cluster "alert-test/parity-paradedb" volume "parity-paradedb-1" is 95%
                full.
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterLowDiskSpace.md
      - eval_time: 10m
        alertname: CNPGClusterLowDiskSpaceCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: alert-test
              cnpg_cluster: parity-paradedb
              persistentvolumeclaim: parity-paradedb-1
            exp_annotations:
              summary: ParadeDB CNPG Cluster is running out of disk space!
              description:
