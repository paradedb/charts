{{- $alert := "CNPGBackupStale" -}}
{{- if not (has $alert .excludeRules) -}}
{{- $hours := .Values.cluster.monitoring.prometheusRule.backupStaleAfterHours | float64 -}}
{{- if le $hours 0.0 -}}
{{- fail "cluster.monitoring.prometheusRule.backupStaleAfterHours must be positive" -}}
{{- end -}}
alert: {{ $alert }}
annotations:
  summary: ParadeDB CNPG Cluster has no recent successful backup
  description: |-
    CloudNativePG Cluster "{{ .namespace }}/{{ .cluster }}" last completed a successful backup {{ .value }} seconds ago.

    The configured maximum backup age is {{ $hours }} hours. Set it to the backup interval plus a grace period. Everything written since that backup is outside the recovery window.

    This fires on the outcome regardless of cause, so it covers backups that are failing, a schedule that has stopped being reconciled, and backups that were switched off and forgotten.
  runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGBackupStale.md
expr: |
  time() - max(cnpg_collector_last_available_backup_timestamp{namespace="{{ .namespace }}",pod=~"{{ .podSelector }}"}) > {{ $hours }} * 3600
for: 15m
labels:
  severity: critical
  namespace: {{ .namespace }}
  cnpg_cluster: {{ .cluster }}
{{- range $key, $val := .additionalLabels }}
  {{ $key }}: {{ $val | toString | quote }}
{{- end }}
{{- end -}}
