rule_files:
  - rules-3.yaml
evaluation_interval: 1m
tests:
  - name: successful scrape without collector metrics becomes critical after ten minutes
    interval: 1m
    input_series:
      - series: up{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb",instance="10.0.0.1:9187",endpoint="metrics"}
        values: 1+0x25
    alert_rule_test:
      - eval_time: 9m
        alertname: CNPGInstanceMetricsAbsent
        exp_alerts: []
      - eval_time: 10m
        alertname: CNPGInstanceMetricsAbsent
        exp_alerts:
          - exp_labels:
              namespace: alert-test
              cnpg_cluster: alerts-paradedb
              pod: alerts-paradedb-1
              severity: critical
            exp_annotations:
              summary: ParadeDB CNPG instance metrics are missing
              description:
                'ParadeDB CNPG instance "alert-test/alerts-paradedb-1" has responded to scrapes without
                collector metrics for 10 minutes.


                Alerts that depend on missing series cannot fire. Check database and replication health directly.'
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGInstanceMetricsAbsent.md
      - eval_time: 20m
        alertname: CNPGInstanceMetricsAbsent
        exp_alerts:
          - exp_labels:
              namespace: alert-test
              cnpg_cluster: alerts-paradedb
              pod: alerts-paradedb-1
              severity: critical
            exp_annotations:
              summary: ParadeDB CNPG instance metrics are missing
              description:
                'ParadeDB CNPG instance "alert-test/alerts-paradedb-1" has responded to scrapes without
                collector metrics for 10 minutes.


                Alerts that depend on missing series cannot fire. Check database and replication health directly.'
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGInstanceMetricsAbsent.md
      - eval_time: 20m
        alertname: TargetDown
        exp_alerts: []
  - name: unreachable exporter warns without a critical missing-collector alert
    interval: 1m
    input_series:
      - series: up{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb",instance="10.0.0.1:9187",endpoint="metrics"}
        values: 0+0x25
    alert_rule_test:
      - eval_time: 9m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 10m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              namespace: alert-test
              cnpg_cluster: alerts-paradedb
              pod: alerts-paradedb-1
              job: alert-test/alerts-paradedb
              instance: 10.0.0.1:9187
              endpoint: metrics
              severity: warning
            exp_annotations:
              summary: A scrape target is unreachable
              description:
                Metrics endpoint for instance "alert-test/alerts-paradedb-1" has been unreachable
                for 10 minutes. Check the pod, metrics service, TLS settings, and network access.
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGInstanceMetricsAbsent.md
      - eval_time: 20m
        alertname: CNPGInstanceMetricsAbsent
        exp_alerts: []
  - name: healthy collector and unrelated namespaces pods and endpoints do not alert
    interval: 1m
    input_series:
      - series: up{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb",instance="10.0.0.1:9187",endpoint="metrics"}
        values: 1+0x25
      - series: cnpg_collector_up{namespace="alert-test",pod="alerts-paradedb-1"}
        values: 0+0x25
      - series: up{namespace="other",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb",instance="10.0.0.1:9187",endpoint="metrics"}
        values: 0+0x25
      - series: up{namespace="alert-test",pod="other-paradedb-1",job="alert-test/alerts-paradedb",instance="10.0.0.1:9187",endpoint="metrics"}
        values: 0+0x25
      - series: up{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb",instance="10.0.0.1:9187",endpoint="pooler"}
        values: 0+0x25
    alert_rule_test:
      - eval_time: 20m
        alertname: CNPGInstanceMetricsAbsent
        exp_alerts: []
      - eval_time: 20m
        alertname: TargetDown
        exp_alerts: []
  - name: collector recovery clears critical alert
    interval: 1m
    input_series:
      - series: up{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb",instance="10.0.0.1:9187",endpoint="metrics"}
        values: 1+0x25
      - series: cnpg_collector_up{namespace="alert-test",pod="alerts-paradedb-1"}
        values: _x11 0+0x14
    alert_rule_test:
      - eval_time: 10m
        alertname: CNPGInstanceMetricsAbsent
        exp_alerts:
          - exp_labels:
              namespace: alert-test
              cnpg_cluster: alerts-paradedb
              pod: alerts-paradedb-1
              severity: critical
            exp_annotations:
              summary: ParadeDB CNPG instance metrics are missing
              description:
                'ParadeDB CNPG instance "alert-test/alerts-paradedb-1" has responded to scrapes without
                collector metrics for 10 minutes.


                Alerts that depend on missing series cannot fire. Check database and replication health directly.'
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGInstanceMetricsAbsent.md
      - eval_time: 15m
        alertname: CNPGInstanceMetricsAbsent
        exp_alerts: []
  - name: successful scrapes clear unreachable warning
    interval: 1m
    input_series:
      - series: up{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb",instance="10.0.0.1:9187",endpoint="metrics"}
        values: 0+0x11 1+0x14
      - series: cnpg_collector_up{namespace="alert-test",pod="alerts-paradedb-1"}
        values: 0+0x25
    alert_rule_test:
      - eval_time: 10m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              namespace: alert-test
              cnpg_cluster: alerts-paradedb
              pod: alerts-paradedb-1
              job: alert-test/alerts-paradedb
              instance: 10.0.0.1:9187
              endpoint: metrics
              severity: warning
            exp_annotations:
              summary: A scrape target is unreachable
              description:
                Metrics endpoint for instance "alert-test/alerts-paradedb-1" has been unreachable
                for 10 minutes. Check the pod, metrics service, TLS settings, and network access.
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGInstanceMetricsAbsent.md
      - eval_time: 15m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 15m
        alertname: CNPGInstanceMetricsAbsent
        exp_alerts: []
  - name: deleted scrape target clears warning
    interval: 1m
    input_series:
      - series: up{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb",instance="10.0.0.1:9187",endpoint="metrics"}
        values: 0+0x11 stale
    alert_rule_test:
      - eval_time: 10m
        alertname: TargetDown
        exp_alerts:
          - exp_labels:
              namespace: alert-test
              cnpg_cluster: alerts-paradedb
              pod: alerts-paradedb-1
              job: alert-test/alerts-paradedb
              instance: 10.0.0.1:9187
              endpoint: metrics
              severity: warning
            exp_annotations:
              summary: A scrape target is unreachable
              description:
                Metrics endpoint for instance "alert-test/alerts-paradedb-1" has been unreachable
                for 10 minutes. Check the pod, metrics service, TLS settings, and network access.
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGInstanceMetricsAbsent.md
      - eval_time: 20m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 20m
        alertname: CNPGInstanceMetricsAbsent
        exp_alerts: []
  - name: short outage does not fire either alert
    interval: 1m
    input_series:
      - series: up{namespace="alert-test",pod="alerts-paradedb-1",job="alert-test/alerts-paradedb",instance="10.0.0.1:9187",endpoint="metrics"}
        values: 0+0x8 1+0x16
      - series: cnpg_collector_up{namespace="alert-test",pod="alerts-paradedb-1"}
        values: 0+0x25
    alert_rule_test:
      - eval_time: 9m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 15m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 20m
        alertname: CNPGInstanceMetricsAbsent
        exp_alerts: []
