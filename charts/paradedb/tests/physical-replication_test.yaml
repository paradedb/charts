rule_files:
- rules.generated.yaml
evaluation_interval: 1m
tests:
- name: 'warning: default sender backlog alerts on receiving replica after five minutes'
  interval: 1m
  input_series:
  - series: cnpg_pg_stat_replication_replay_diff_bytes{namespace="customer-acme",pod="db-1",application_name="db-2",usename="streaming_replica"}
    values: 2147483648+0x20
  alert_rule_test:
  - eval_time: 4m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts: []
  - eval_time: 10m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts:
    - exp_labels:
        namespace: customer-acme
        pod: db-2
        severity: warning
        cnpg_cluster: db
      exp_annotations:
        summary: ParadeDB physical replica WAL backlog warning
        description: Physical replica "customer-acme/db-2" has 2 GiB of unreplayed
          WAL. Check WAL ingestion, replay progress, disk, network, and recovery conflicts.
        runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
- name: 'warning: idle caught-up replica ignores old transaction age'
  interval: 1m
  input_series:
  - series: cnpg_pg_stat_replication_replay_diff_bytes{namespace="customer-acme",pod="db-1",application_name="db-2",usename="streaming_replica"}
    values: 0+0x20
  - series: cnpg_pg_replication_lag{namespace="customer-acme",pod="db-2"}
    values: 8432+0x20
  alert_rule_test:
  - eval_time: 4m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts: []
  - eval_time: 10m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts: []
- name: 'warning: exact threshold is silent'
  interval: 1m
  input_series:
  - series: cnpg_pg_stat_replication_replay_diff_bytes{namespace="customer-acme",pod="db-1",application_name="db-2",usename="streaming_replica"}
    values: 1073741824+0x20
  alert_rule_test:
  - eval_time: 4m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts: []
  - eval_time: 10m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts: []
- name: 'warning: small backlog does not alert'
  interval: 1m
  input_series:
  - series: cnpg_pg_stat_replication_replay_diff_bytes{namespace="customer-acme",pod="db-1",application_name="db-2",usename="streaming_replica"}
    values: 8024+0x20
  - series: cnpg_pg_replication_lag{namespace="customer-acme",pod="db-2"}
    values: 8432+0x20
  alert_rule_test:
  - eval_time: 4m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts: []
  - eval_time: 10m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts: []
- name: 'warning: logical connections are excluded'
  interval: 1m
  input_series:
  - series: cnpg_pg_stat_replication_replay_diff_bytes{namespace="customer-acme",pod="db-1",application_name="db-2",usename="logical_replication"}
    values: 2147483648+0x20
  alert_rule_test:
  - eval_time: 4m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts: []
  - eval_time: 10m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts: []
- name: 'warning: empty application name cannot identify replica'
  interval: 1m
