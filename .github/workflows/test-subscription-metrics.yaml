name: Test Subscription Metrics

on:
  pull_request:
    paths:
      - "charts/paradedb/**"
      - ".github/scripts/test-subscription-metrics.py"
      - ".github/workflows/test-subscription-metrics.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  subscription-metrics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: [14, 15, 16, 17, 18]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: pip install pyyaml
      - name: Test rendered subscription query
        run: |
          helm template db charts/paradedb --set-string version.postgresql=${{ matrix.postgres }} \
            --set cluster.monitoring.instrumentation.logicalReplication=true \
            --show-only templates/monitoring-logical-replication.yaml > /tmp/subscription-queries.yaml
          python3 .github/scripts/test-subscription-metrics.py /tmp/subscription-queries.yaml
      - name: Test logical replication alert rules
        if: matrix.postgres == 18
        run: |
          curl -fsSL https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v1.148.0/vmutils-linux-amd64-v1.148.0.tar.gz \
            | tar xz vmalert-tool-prod
          helm template db charts/paradedb --namespace customer-acme --set fullnameOverride=db \
            --set cluster.monitoring.enabled=true --set cluster.monitoring.prometheusRule.enabled=true \
            --show-only templates/prometheus-rule.yaml > /tmp/subscription-rules.yaml
          python3 -c 'import yaml; from pathlib import Path; p=Path("charts/paradedb/tests/rules.generated.yaml"); p.write_text(yaml.safe_dump(yaml.safe_load(Path("/tmp/subscription-rules.yaml").read_text())["spec"]))'
          cd charts/paradedb/tests
          ../../../vmalert-tool-prod unittest --disableAlertgroupLabel --files=logical-replication_test.yaml
