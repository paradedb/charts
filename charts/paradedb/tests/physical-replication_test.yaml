    exp_alerts: []
- name: 'warning: primary change attributes new backlog to former primary'
  interval: 1m
  input_series:
  - series: cnpg_pg_stat_replication_replay_diff_bytes{namespace="customer-acme",pod="db-1",application_name="db-2",usename="streaming_replica"}
    values: 0+0x4 stale
  - series: cnpg_pg_stat_replication_replay_diff_bytes{namespace="customer-acme",pod="db-2",application_name="db-1",usename="streaming_replica"}
    values: _ _ _ _ _ 2147483648+0x15
  alert_rule_test:
  - eval_time: 6m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts: []
  - eval_time: 12m
    alertname: CNPGClusterPhysicalReplicationBacklogWarning
    exp_alerts:
    - exp_labels:
        namespace: customer-acme
        pod: db-1
        severity: warning
        cnpg_cluster: db
      exp_annotations:
        summary: ParadeDB physical replica WAL backlog warning
        description: Physical replica "customer-acme/db-1" has 2 GiB of unreplayed
          WAL. Check WAL ingestion, replay progress, disk, network, and recovery conflicts.
        runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
