name: Test ParadeDB Helm Chart

on:
  pull_request:
    branches-ignore:
      - "gh-pages"
  workflow_dispatch:

permissions: read-all

jobs:
  test-alert-rules:
    name: Unit Test Physical Replication Alerts
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Helm
        uses: azure/setup-helm@v5
      - name: Install Test Tools
        run: |
          curl -fsSL https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v1.148.0/vmutils-linux-amd64-v1.148.0.tar.gz \
            | tar xz vmalert-tool-prod
          pip install pyyaml
      - name: Render Alert Rules
        run: |
          helm template db charts/paradedb --namespace customer-acme \
            --set fullnameOverride=db --set cluster.instances=3 \
            --set cluster.monitoring.enabled=true \
            --set cluster.monitoring.prometheusRule.enabled=true \
            --show-only templates/prometheus-rule.yaml > /tmp/alert-rules.yaml
          python3 - <<'PYTHON'
          import pathlib
          import yaml
          rules = yaml.safe_load(pathlib.Path("/tmp/alert-rules.yaml").read_text())["spec"]
          pathlib.Path("charts/paradedb/tests/rules.generated.yaml").write_text(yaml.safe_dump(rules))
          PYTHON
      - name: Test Alert Rules
        working-directory: charts/paradedb/tests
        run: ${{ github.workspace }}/vmalert-tool-prod unittest --disableAlertgroupLabel --files=physical-replication_test.yaml

  test-list:
    runs-on: ubuntu-26.04
    outputs:
      tests: ${{ steps.listTests.outputs.tests }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - id: listTests
        run: |
          printf 'tests=%s\n' "$(find charts/paradedb/test -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | jq -cRn '{ include: [inputs | { test: "\(.)" }]}')" >> "$GITHUB_OUTPUT"

  test:
    needs: test-list
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.test-list.outputs.tests) }}
    name: ${{ matrix.test }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Added by ParadeDB: Authenticate to Docker Hub to avoid rate limits
      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      # Added by ParadeDB: Use the ParadeDB release marked Latest on GitHub
      - name: Set ParadeDB Version to Latest Release
        working-directory: charts/paradedb/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh api repos/paradedb/paradedb/releases/latest --jq '.tag_name')
          APP_VERSION=${LATEST_TAG#v}
          sed -i "s/^[[:space:]]*paradedb: .*/  paradedb: \"$APP_VERSION\"/" values.yaml
          sed -i "s/^version: .*/version: ${{ vars.CHART_VERSION_MAJOR }}.${{ vars.CHART_VERSION_MINOR }}.${{ vars.CHART_VERSION_PATCH }}/" Chart.yaml
          echo "values.yaml:"
          cat values.yaml
          echo "----------------------------------------"
          echo "Chart.yaml:"
          cat Chart.yaml

      - name: Setup kind
        uses: ./.github/actions/setup-kind

      - name: Deploy the operator
        uses: ./.github/actions/deploy-operator

      - name: Install cert-manager
        uses: ./.github/actions/deploy-cert-manager

      - name: Install Barman Cloud plugin
        run: |
          helm repo add cnpg https://cloudnative-pg.github.io/charts
          helm upgrade --install plugin-barman-cloud \
            --namespace cnpg-system \
            --version 0.7.1 \
            cnpg/plugin-barman-cloud

      - name: Install Prometheus CRDs
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm install prometheus-crds prometheus-community/prometheus-operator-crds

      - name: Install Chainsaw
        uses: kyverno/action-install-chainsaw@1223ef75bedeb59c4e7b5455463d4316e76dff01 # v0.2.15
        with:
          verify: true

      - name: Setup RustFS
        env:
          # renovate: datasource=helm depName=rustfs registryUrl=https://charts.rustfs.com
          RUSTFS_CHART_VERSION: "1.0.0"
        run: |
          kubectl apply -f ./.github/rustfs-prereqs.yaml
          kubectl -n object-store wait --for=condition=Ready certificate/object-store-tls --timeout=120s
          helm repo add rustfs https://charts.rustfs.com
          helm upgrade \
            --install \
            --namespace object-store \
            --version $RUSTFS_CHART_VERSION \
            --values ./.github/rustfs.yaml \
            --wait \
            rustfs rustfs/rustfs
          kubectl apply -f ./.github/rustfs-bucket-init.yaml
          kubectl -n object-store wait --for=condition=complete job/rustfs-bucket-init --timeout=180s

      # The Docker Hub tokens are required for the ParadeDB Enterprise tests
      - name: Run Kyverno/Chainsaw
        run: chainsaw test --values .github/chainsaw-values.yaml "charts/paradedb/test/${MATRIX_TEST}"
        env:
          MATRIX_TEST: ${{ matrix.test }}
          PARADEDB_ENTERPRISE_DOCKER_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          PARADEDB_ENTERPRISE_DOCKER_PAT: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
