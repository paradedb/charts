rule_files:
  - rules.generated.yaml
evaluation_interval: 1m
tests:
  - name: 95 percent usage on data PVC
    interval: 1m
    input_series:
      - series: kubelet_volume_stats_available_bytes{namespace="alert-test",persistentvolumeclaim="parity-paradedb-1"}
        values: 5+0x40
      - series: kubelet_volume_stats_used_bytes{namespace="alert-test",persistentvolumeclaim="parity-paradedb-1"}
        values: 95+0x40
      - series: kubelet_volume_stats_capacity_bytes{namespace="alert-test",persistentvolumeclaim="parity-paradedb-1"}
        values: 100+0x40
    alert_rule_test:
      - eval_time: 10m
        alertname: CNPGClusterLowDiskSpaceWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: alert-test
              cnpg_cluster: parity-paradedb
            exp_annotations:
              summary: ParadeDB Instance is running out of disk space.
              description: ParadeDB CloudNativePG Cluster "alert-test/parity-paradedb" is running low on disk space. Check attached PVCs. Current disk space
                usage is 95% of the total capacity.
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterLowDiskSpace.md
      - eval_time: 10m
        alertname: CNPGClusterLowDiskSpaceCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: alert-test
              cnpg_cluster: parity-paradedb
            exp_annotations:
              summary: ParadeDB Instance is running out of disk space!
              description: ParadeDB CloudNativePG Cluster "alert-test/parity-paradedb" is running extremely low on disk space. Check attached PVCs! Current
                disk space usage is 95% of the total capacity.
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterLowDiskSpace.md
  - name: 95 percent usage on -wal PVC
    interval: 1m
    input_series:
      - series: kubelet_volume_stats_available_bytes{namespace="alert-test",persistentvolumeclaim="parity-paradedb-1-wal"}
        values: 5+0x40
      - series: kubelet_volume_stats_used_bytes{namespace="alert-test",persistentvolumeclaim="parity-paradedb-1-wal"}
        values: 95+0x40
      - series: kubelet_volume_stats_capacity_bytes{namespace="alert-test",persistentvolumeclaim="parity-paradedb-1-wal"}
        values: 100+0x40
    alert_rule_test:
      - eval_time: 10m
        alertname: CNPGClusterLowDiskSpaceWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: alert-test
              cnpg_cluster: parity-paradedb
            exp_annotations:
              summary: ParadeDB Instance is running out of disk space.
              description: ParadeDB CloudNativePG Cluster "alert-test/parity-paradedb" is running low on disk space. Check attached PVCs. Current disk space
                usage is 95% of the total capacity.
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterLowDiskSpace.md
      - eval_time: 10m
        alertname: CNPGClusterLowDiskSpaceCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: alert-test
              cnpg_cluster: parity-paradedb
            exp_annotations:
              summary: ParadeDB Instance is running out of disk space!
              description: ParadeDB CloudNativePG Cluster "alert-test/parity-paradedb" is running extremely low on disk space. Check attached PVCs! Current
                disk space usage is 95% of the total capacity.
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterLowDiskSpace.md
  - name: 95 percent usage on -tbs1 PVC
    interval: 1m
    input_series:
      - series: kubelet_volume_stats_available_bytes{namespace="alert-test",persistentvolumeclaim="parity-paradedb-1-tbs1"}
        values: 5+0x40
      - series: kubelet_volume_stats_used_bytes{namespace="alert-test",persistentvolumeclaim="parity-paradedb-1-tbs1"}
        values: 95+0x40
      - series: kubelet_volume_stats_capacity_bytes{namespace="alert-test",persistentvolumeclaim="parity-paradedb-1-tbs1"}
        values: 100+0x40
      - series: kube_pod_spec_volumes_persistentvolumeclaims_info{namespace="alert-test",pod="parity-paradedb-1",persistentvolumeclaim="parity-paradedb-1-tbs1",volume="tablespace"}
        values: 1+0x40
      - series: kube_pod_spec_volumes_persistentvolumeclaims_info{namespace="other",pod="parity-paradedb-1",persistentvolumeclaim="parity-paradedb-1-tbs1",volume="tablespace"}
        values: 1+0x40
    alert_rule_test:
      - eval_time: 10m
        alertname: CNPGClusterLowDiskSpaceWarning
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: alert-test
              cnpg_cluster: parity-paradedb
            exp_annotations:
              summary: ParadeDB Instance is running out of disk space.
              description: ParadeDB CloudNativePG Cluster "alert-test/parity-paradedb" is running low on disk space. Check attached PVCs. Current disk space
                usage is 95% of the total capacity.
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterLowDiskSpace.md
      - eval_time: 10m
        alertname: CNPGClusterLowDiskSpaceCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              namespace: alert-test
              cnpg_cluster: parity-paradedb
            exp_annotations:
              summary: ParadeDB Instance is running out of disk space!
              description: ParadeDB CloudNativePG Cluster "alert-test/parity-paradedb" is running extremely low on disk space. Check attached PVCs! Current
                disk space usage is 95% of the total capacity.
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterLowDiskSpace.md
  - name: healthy storage and full unrelated cluster
    interval: 1m
    input_series:
      - series: kubelet_volume_stats_available_bytes{namespace="alert-test",persistentvolumeclaim="parity-paradedb-1-wal"}
        values: 50+0x40
      - series: kubelet_volume_stats_capacity_bytes{namespace="alert-test",persistentvolumeclaim="parity-paradedb-1-wal"}
        values: 100+0x40
      - series: kubelet_volume_stats_available_bytes{namespace="alert-test",persistentvolumeclaim="other-1-wal"}
        values: 0+0x40
      - series: kubelet_volume_stats_capacity_bytes{namespace="alert-test",persistentvolumeclaim="other-1-wal"}
        values: 100+0x40
    alert_rule_test:
      - eval_time: 20m
        alertname: CNPGClusterLowDiskSpaceWarning
        exp_alerts: []
      - eval_time: 20m
        alertname: CNPGClusterLowDiskSpaceCritical
        exp_alerts: []
