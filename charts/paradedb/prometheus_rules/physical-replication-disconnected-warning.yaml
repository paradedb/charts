{{- $alert := "CNPGClusterPhysicalReplicationDisconnectedWarning" -}}
{{- if not (has $alert .excludeRules) -}}
alert: CNPGClusterPhysicalReplicationDisconnectedWarning
annotations:
  summary: ParadeDB physical replication disconnected
  description: 'Physical replica "{{ .namespace }}/{{ .labels.pod }}" has no WAL receiver. Check the upstream connection and PostgreSQL logs. Archive recovery may still be running.'
  runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
# Archive recovery on a dedicated cluster primary does not need a WAL receiver.
# Keep disconnect coverage for its streaming standbys.
expr: |
  (
    (max by (namespace, pod) (cnpg_pg_replication_is_wal_receiver_up{namespace="{{ .namespace }}", pod=~"{{ .podSelector }}"}) == 0) and on (namespace, pod) (max by (namespace, pod) (cnpg_pg_replication_in_recovery{namespace="{{ .namespace }}", pod=~"{{ .podSelector }}"}) == 1)
  )
  unless on (namespace, pod)
  max by (namespace, pod) (
    label_replace(kube_customresource_primary_info{customresource_group="postgresql.cnpg.io", customresource_kind="Cluster", namespace="{{ .namespace }}", cluster="{{ .cluster }}"} == 1, "pod", "$1", "current_primary", "(.+)")
  )
for: 15m
labels:
  severity: warning
  namespace: {{ .namespace }}
  cnpg_cluster: {{ .cluster }}
{{- range $key, $val := .additionalLabels }}
  {{ $key }}: {{ $val | toString | quote }}
{{- end }}
{{- end -}}
