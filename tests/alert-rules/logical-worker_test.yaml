rule_files:
  - rules-3.yaml
evaluation_interval: 1m
tests:
  - name: enabled without worker subscription with no receipt-age or WAL-position metrics
    interval: 1m
    input_series:
      - series: cnpg_pg_stat_subscription_enabled{namespace="alert-test",pod="alerts-paradedb-1",datname="app",subname="test_sub",job="alert-test/alerts-paradedb"}
        values: 1+0x15
      - series: cnpg_pg_replication_in_recovery{namespace="alert-test",pod="alerts-paradedb-1"}
        values: 0+0x15
    alert_rule_test:
      - eval_time: 4m
        alertname: CNPGClusterLogicalReplicationWorkerDown
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterLogicalReplicationWorkerDown
        exp_alerts:
          - exp_labels:
              namespace: alert-test
              cnpg_cluster: alerts-paradedb
              pod: alerts-paradedb-1
              cluster: alerts-paradedb
              datname: app
              subname: test_sub
              severity: critical
              alert_type: logical-replication
            exp_annotations:
              summary: ParadeDB CNPG Cluster logical replication subscription has no apply worker
              description:
                'CloudNativePG Cluster "alert-test/alerts-paradedb" subscription "test_sub" is enabled
                but has no apply worker running.


                Check the subscriber logs for apply worker crashes and the publisher for a dropped or invalidated
                replication slot. Check committed apply progress on the subscriber.'
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterLogicalReplicationStopped.md
      - eval_time: 5m
        alertname: CNPGClusterLogicalReplicationSubscriptionDisabled
        exp_alerts: []
  - name: disabled subscription with no receipt-age or WAL-position metrics
    interval: 1m
    input_series:
      - series: cnpg_pg_stat_subscription_enabled{namespace="alert-test",pod="alerts-paradedb-1",datname="app",subname="test_sub",job="alert-test/alerts-paradedb"}
        values: 0+0x15
      - series: cnpg_pg_replication_in_recovery{namespace="alert-test",pod="alerts-paradedb-1"}
        values: 0+0x15
    alert_rule_test:
      - eval_time: 4m
        alertname: CNPGClusterLogicalReplicationWorkerDown
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterLogicalReplicationWorkerDown
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterLogicalReplicationSubscriptionDisabled
        exp_alerts:
          - exp_labels:
              namespace: alert-test
              cnpg_cluster: alerts-paradedb
              pod: alerts-paradedb-1
              cluster: alerts-paradedb
              datname: app
              subname: test_sub
              severity: warning
              alert_type: logical-replication
            exp_annotations:
              summary: ParadeDB CNPG Cluster logical replication subscription is disabled
              description:
                'CloudNativePG Cluster "alert-test/alerts-paradedb" subscription "test_sub" is disabled.


                Check whether the subscription was disabled for maintenance before enabling it.'
              runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterLogicalReplicationStopped.md
  - name: healthy subscription with no receipt-age or WAL-position metrics
    interval: 1m
    input_series:
      - series: cnpg_pg_stat_subscription_enabled{namespace="alert-test",pod="alerts-paradedb-1",datname="app",subname="test_sub",job="alert-test/alerts-paradedb"}
        values: 1+0x15
      - series: cnpg_pg_replication_in_recovery{namespace="alert-test",pod="alerts-paradedb-1"}
        values: 0+0x15
      - series: cnpg_pg_stat_subscription_pid{namespace="alert-test",pod="alerts-paradedb-1",datname="app",subname="test_sub",job="alert-test/alerts-paradedb"}
        values: 123+0x15
    alert_rule_test:
      - eval_time: 4m
        alertname: CNPGClusterLogicalReplicationWorkerDown
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterLogicalReplicationWorkerDown
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterLogicalReplicationSubscriptionDisabled
        exp_alerts: []
  - name: standby subscription with no receipt-age or WAL-position metrics
    interval: 1m
    input_series:
      - series: cnpg_pg_stat_subscription_enabled{namespace="alert-test",pod="alerts-paradedb-1",datname="app",subname="test_sub",job="alert-test/alerts-paradedb"}
        values: 1+0x15
      - series: cnpg_pg_replication_in_recovery{namespace="alert-test",pod="alerts-paradedb-1"}
        values: 1+0x15
    alert_rule_test:
      - eval_time: 4m
        alertname: CNPGClusterLogicalReplicationWorkerDown
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterLogicalReplicationWorkerDown
        exp_alerts: []
      - eval_time: 5m
        alertname: CNPGClusterLogicalReplicationSubscriptionDisabled
        exp_alerts: []
