{{- $alert := "CNPGClusterLogicalReplicationLaggingCritical" -}}
{{- if not (has $alert .excludeRules) -}}
alert: {{ $alert }}
annotations:
  summary: ParadeDB Logical replication lag critical
  description: |
    CloudNativePG Cluster "{{ .namespace }}/{{ .cluster }}" has critical logical replication lag of {{ .value }}s.

    The subscription has not received messages for over 5 minutes, indicating a significant replication issue.
    Immediate investigation required to prevent data drift and service impact.

    Potential causes:
    - Network connectivity failure between publisher and subscriber
    - Publisher database is down or unreachable
    - Subscription connection is broken
    - Resource constraints preventing message processing
  runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterLogicalReplicationLagging.md
expr: |
  (
    max by (namespace, cluster, pod, datname, subname) (
      label_replace(cnpg_pg_stat_subscription_receipt_lag_seconds{namespace="{{ .namespace }}",pod=~"{{ .podSelector }}"}, "cluster", "$1", "job", ".+/(.+)")
    )
    or
    max by (namespace, cluster, pod, datname, subname) (
      time() - label_replace(cnpg_pg_stat_subscription_last_msg_receipt_time{namespace="{{ .namespace }}",pod=~"{{ .podSelector }}"}, "cluster", "$1", "job", ".+/(.+)")
    )
  ) > 300
for: 2m
labels:
  severity: critical
  namespace: {{ .namespace }}
  cnpg_cluster: {{ .cluster }}
  alert_type: logical-replication
  subname: "{{ .labels.subname }}"
{{- range $key, $val := .additionalLabels }}
  {{ $key }}: {{ $val | toString | quote }}
{{- end }}
{{- end -}}
