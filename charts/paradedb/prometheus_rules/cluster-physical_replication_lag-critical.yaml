{{- $alert := "CNPGClusterPhysicalReplicationLagCritical" -}}
{{- if not (has $alert .excludeRules) -}}
alert: {{ $alert }}
annotations:
  summary: ParadeDB CNPG Cluster very high physical replication lag
  description: |-
    CloudNativePG Cluster "{{ .namespace }}/{{ .cluster }}" is experiencing a very high physical replication lag of {{ .value }}s.

    High replication lag indicates network issues, busy instances, slow queries or suboptimal configuration.
  runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGClusterPhysicalReplicationLag.md
# Streaming latency uses WAL acknowledgment timing; application_name is the standby.
# Retain the old transaction-age heuristic only for replica-mode instances without
# a matching sender series, since archive replay has no pg_stat_replication row.
expr: |
  max(label_replace(cnpg_pg_stat_replication_replay_lag_seconds{namespace="{{ .namespace }}", pod=~"{{ .podSelector }}", usename="streaming_replica", application_name=~"{{ .podSelector }}"}, "pod", "$1", "application_name", "(.+)")) > 600
  or
  max(
    (
      cnpg_pg_replication_lag{namespace="{{ .namespace }}",pod=~"{{ .podSelector }}"}
      and on ()
      (max(cnpg_collector_replica_mode{namespace="{{ .namespace }}",pod=~"{{ .podSelector }}"}) == 1)
    )
    unless on (namespace, pod)
    label_replace(cnpg_pg_stat_replication_replay_lag_seconds{namespace="{{ .namespace }}", pod=~"{{ .podSelector }}", usename="streaming_replica", application_name=~"{{ .podSelector }}"}, "pod", "$1", "application_name", "(.+)")
  ) > 600
for: 5m
labels:
  severity: critical
  namespace: {{ .namespace }}
  cnpg_cluster: {{ .cluster }}
{{- range $key, $val := .additionalLabels }}
  {{ $key }}: {{ $val | toString | quote }}
{{- end }}
{{- end -}}
