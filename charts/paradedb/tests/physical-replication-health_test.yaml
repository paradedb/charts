  metricsql_expr_test:
  - expr: "(((max by (namespace, pod) (cnpg_paradedb_physical_replication_receiver_up{namespace=\"\
      customer-acme\", pod=~\"db-([1-9][0-9]*)$\"}) == 0) and on (namespace, pod)\
