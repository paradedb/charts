{{- $alert := "TargetDown" -}}
{{- if not (has $alert .excludeRules) -}}
alert: {{ $alert }}
annotations:
  summary: A scrape target is unreachable
  description: 'Metrics endpoint for instance "{{ .namespace }}/{{ .labels.pod }}" has been unreachable for 10 minutes. Check the pod, metrics service, TLS settings, and network access.'
  runbook_url: https://github.com/paradedb/charts/blob/main/charts/paradedb/docs/runbooks/CNPGInstanceMetricsAbsent.md
expr: |
  up{namespace="{{ .namespace }}",pod=~"{{ .podSelector }}",endpoint="metrics"} == 0
for: 10m
labels:
  severity: warning
  namespace: {{ .namespace }}
  cnpg_cluster: {{ .cluster }}
{{- range $key, $val := .additionalLabels }}
  {{ $key }}: {{ $val | toString | quote }}
{{- end }}
{{- end -}}
